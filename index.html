  <style>
    body {
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      margin: 0; padding: 20px;
    }
    .card {
      max-width: 720px; margin: 0 auto; padding: 18px;
      border: 1px solid #ddd; border-radius: 14px;
    }
    .top {
      display:flex; justify-content:space-between; align-items:center;
      gap:12px; flex-wrap:wrap;
    }
    .badge {
      font-size: 14px; padding: 6px 10px;
      border-radius: 999px; border: 1px solid #ddd;
    }
    .word { font-size: 44px; font-weight: 700; margin: 18px 0 10px; line-height: 1.1; }
    .meaning { font-size: 28px; margin: 10px 0 0; min-height: 40px; }
    .hint { color:#666; font-size:14px; margin-top: 10px; }
    .btns { display:flex; gap:10px; margin-top: 18px; flex-wrap: wrap; }
    button {
      font-size: 18px; padding: 12px 14px; border-radius: 12px;
      border: 1px solid #ddd; background: #fff;
    }
    button:active { transform: translateY(1px); }
    .primary { font-weight: 700; }
    .danger { border-color:#f2c; }

    /* Toggle */
    .toggle {
      display:flex; align-items:center; gap:10px;
      margin-top: 10px; padding: 10px 12px;
      border: 1px solid #ddd; border-radius: 12px;
    }
    .toggle label { font-size: 16px; user-select: none; }
    .toggle input { width: 20px; height: 20px; }
    .small { font-size: 13px; color:#666; margin-top: 6px; }
  </style>
</head>
<body>

const AUTO_SPEAK_KEY = "IDIOMS_auto_speak_v1";

// ======== 発音（Web Speech API） ========
function speakEnglish(text) {
  if (!("speechSynthesis" in window)) return;

  // 連打したとき前の音声を止める
  window.speechSynthesis.cancel();

  const uttr = new SpeechSynthesisUtterance(text);
  uttr.rate = 0.9; // 少しゆっくり（0.1〜10）

  // 英語の声を優先して選ぶ（端末依存）
  const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
  const pick =
    voices.find(v => (v.lang || "").toLowerCase().startsWith("en-us")) ||
    voices.find(v => (v.lang || "").toLowerCase().startsWith("en-gb")) ||
    voices.find(v => (v.lang || "").toLowerCase().startsWith("en")) ||
    null;

  uttr.lang = pick?.lang || "en-US";
  if (pick) uttr.voice = pick;

  window.speechSynthesis.speak(uttr);
}

// iOS Safari対策：声リストの準備
if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    try { window.speechSynthesis.getVoices(); } catch {}
  };
}

// ======== 保存キー（出題状態） ========
const KEY = "IDIOMS_app_state_v1";

// ======== Fisher–Yates shuffle ========
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function freshState() {
  const order = shuffle([...Array(IDIOMS.length).keys()]);
  return { order, index: 0, phase: 0 };
}

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const st = JSON.parse(raw);
    if (!st || !Array.isArray(st.order) || typeof st.index !== "number" || typeof st.phase !== "number") return null;
    if (st.order.length !== IDIOMS.length) return null;
    if (st.index < 0 || st.index > IDIOMS.length) return null;
    if (st.phase !== 0 && st.phase !== 1) return null;
    return st;
  } catch {
    return null;
  }
}

function saveState(st) {
  localStorage.setItem(KEY, JSON.stringify(st));
}

// ======== 自動発音設定の保存/読込 ========
function loadAutoSpeak() {
  try {
    const raw = localStorage.getItem(AUTO_SPEAK_KEY);
    if (raw === null) return false; // 初期OFF（好みでtrueにもできます）
    return raw === "1";
  } catch {
    return false;
  }
}
function saveAutoSpeak(on) {
  localStorage.setItem(AUTO_SPEAK_KEY, on ? "1" : "0");
}

// ======== UI更新 ========
function setUI(st) {
  const wordEl = document.getElementById("word");
  const meaningEl = document.getElementById("meaning");
  const progressEl = document.getElementById("progress");
  const btn = document.getElementById("nextBtn");

  // 1周終わったら新しいシャッフルで再スタート
  if (st.index >= IDIOMS.length) {
    st = freshState();
    saveState(st);
  }

  const current = IDIOMS[st.order[st.index]];
  progressEl.textContent = `${st.index + 1} / ${IDIOMS.length}`;

  if (st.phase === 0) {
    wordEl.textContent = current.en;
    meaningEl.textContent = "";
    btn.textContent = "日本語を表示（答え合わせ）";

    // ★自動発音（ONのときだけ）
    if (loadAutoSpeak()) {
      speakEnglish(current.en);
    }
  } else {
    wordEl.textContent = current.en;
    meaningEl.textContent = current.ja;
    btn.textContent = "正解だったかな？次へ語GO！";
  }
}

// ======== 次へ（英→日→次の英） ========
function nextAction() {
  let st = loadState();
  if (!st) st = freshState();

  if (st.phase === 0) {
    st.phase = 1;     // 日本語表示
  } else {
    st.phase = 0;     // 次の英語へ
    st.index += 1;
  }
  saveState(st);
  setUI(st);
}

function resetAll() {
  const st = freshState();
  saveState(st);
  setUI(st);
}

// ======== 初期化 ========
function init() {
  if (!IDIOMS.length) {
    document.getElementById("word").textContent = "IDIOMSが空です（単語リストを入れてください）";
    return;
  }

  // 自動発音トグルの初期反映
  const toggle = document.getElementById("autoSpeakToggle");
  toggle.checked = loadAutoSpeak();
  toggle.addEventListener("change", () => {
    saveAutoSpeak(toggle.checked);
    // ONに切り替えた瞬間、表示中の英単語を読みたい場合は以下を有効化
    if (toggle.checked) {
      const st = loadState();
      if (st && st.phase === 0) {
        const current = IDIOMS[st.order[st.index]];
        speakEnglish(current.en);
      }
    }
  });

  let st = loadState();
  if (!st) {
    st = freshState();
    saveState(st);
  }
  setUI(st);

  document.getElementById("nextBtn").addEventListener("click", nextAction);

  document.getElementById("speakBtn").addEventListener("click", () => {
    const st = loadState();
    if (!st) return;
    const current = IDIOMS[st.order[st.index]];
    speakEnglish(current.en);
  });

  document.getElementById("resetBtn").addEventListener("click", resetAll);
}

init();
</script>
